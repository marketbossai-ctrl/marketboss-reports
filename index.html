<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Market Boss AI — Client Reports & Spotlights</title>
<style>
  :root { --brand: #2563eb; --ink: #0f172a; --muted: #64748b; --bg: #f8fafc; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background: var(--bg); color: var(--ink); line-height: 1.6; }
  header { background: linear-gradient(135deg, #1e3a8a, #2563eb); color: #fff; padding: 3rem 1.5rem; text-align: center; }
  header h1 { font-size: 2rem; margin-bottom: .5rem; }
  header p { color: #dbeafe; max-width: 560px; margin: 0 auto; }
  main { max-width: 760px; margin: 2rem auto; padding: 0 1.5rem; }
  .card { background: #fff; border: 1px solid #e2e8f0; border-radius: 12px; padding: 1.5rem; margin-bottom: 1.25rem; box-shadow: 0 1px 3px rgba(0,0,0,.04); }
  .card h2 { font-size: 1.15rem; margin-bottom: .35rem; }
  .card p { color: var(--muted); font-size: .95rem; }
  .card a { color: var(--brand); text-decoration: none; font-weight: 600; }
  .empty { text-align: center; color: var(--muted); padding: 2rem 0; }
  footer { text-align: center; color: var(--muted); font-size: .85rem; padding: 2rem 1.5rem; }
</style>
</head>
<body>
<header>
  <h1>Market Boss AI</h1>
  <p>Client Spotlight features and local business audit reports, hosted for easy sharing.</p>
</header>
<main>
  <div class="empty">
    <p>New reports will appear here as they are published.</p>
  </div>
</main>
<footer>&copy; 2026 Market Boss AI</footer>
</body>
</html>
