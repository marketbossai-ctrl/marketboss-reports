<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Market Boss AI — Live SEO Audit | Market Boss AI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500&family=Playfair+Display:wght@700;800&display=swap" rel="stylesheet">
<style>
  :root { --night: #0B0F1A; --card: #131827; --border: #1F2937; --text: #F1F5F9; --muted: #6B7280; --accent: #3B82F6; --gold: #F59E0B; --green: #10B981; --red: #EF4444; --orange: #F97316; --blue: #37B5FF; --purple: #8B5CF6; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Inter', -apple-system, sans-serif; background: var(--night); color: var(--text); line-height: 1.7; }
  
  .top-bar { background: #0B0F1A; border-bottom: 1px solid var(--border); padding: .75rem 1.5rem; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: .5rem; font-size: .9rem; color: var(--muted); }
  .top-bar a { color: var(--blue); text-decoration: none; font-weight: 600; }
  .top-bar .phone { color: var(--gold); font-weight: 700; }

  .hero { background: linear-gradient(135deg, #0D0433 0%, #1a0a5e 50%, #2563EB 100%); padding: 4rem 1.5rem 3rem; text-align: center; position: relative; overflow: hidden; }
  .hero::before { content: ''; position: absolute; top: -50%; left: -50%; width: 200%; height: 200%; background: radial-gradient(ellipse at 30% 50%, rgba(59,130,246,.08) 0%, transparent 60%), radial-gradient(ellipse at 70% 50%, rgba(6,182,212,.06) 0%, transparent 60%); pointer-events: none; }
  .hero .wrap { position: relative; max-width: 820px; margin: 0 auto; }
  .hero .tier-badge { display: inline-block; background: rgba(55,181,255,.15); color: var(--blue); padding: .25rem .75rem; border-radius: 20px; font-size: .8rem; font-weight: 600; margin-bottom: .5rem; border: 1px solid rgba(55,181,255,.2); }
.badge { display: inline-block; background: rgba(59,130,246,.15); color: var(--blue); font-size: .75rem; font-weight: 700; text-transform: uppercase; letter-spacing: 2px; padding: .35rem .85rem; border-radius: 20px; margin-bottom: 1.25rem; border: 1px solid rgba(6,182,212,.2); }
  .hero h1 { font-family: 'Playfair Display', Georgia, serif; font-size: 2.8rem; font-weight: 800; margin-bottom: .5rem; background: linear-gradient(135deg, #F1F5F9, #60A5FA); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
  .hero .sub { color: var(--muted); font-size: 1.05rem; max-width: 600px; margin: 0 auto; }
  .hero .meta { color: var(--muted); font-size: .85rem; margin-top: 1rem; }

  .grade-banner { max-width: 820px; margin: -2.5rem auto 0; padding: 0 1.5rem; position: relative; z-index: 10; }
  .grade { background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 2rem; box-shadow: 0 8px 32px rgba(0,0,0,.3); display: flex; align-items: center; gap: 1.5rem; }
  .grade .letter { font-family: 'Playfair Display', Georgia, serif; font-size: 4.5rem; font-weight: 800; line-height: 1; background: linear-gradient(135deg, #10B981, #06B6D4); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
  .grade .txt { flex: 1; }
  .grade .txt strong { display: block; font-size: 1.15rem; margin-bottom: .25rem; }
  .grade .txt p { color: var(--muted); font-size: .95rem; margin: 0; }

  main { max-width: 820px; margin: 2rem auto; padding: 0 1.5rem 3rem; }
  section { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 1.75rem; margin-bottom: 1.25rem; }
  h2 { font-family: 'Inter', sans-serif; font-size: 1.2rem; font-weight: 700; margin-bottom: 1rem; color: var(--text); display: flex; align-items: center; gap: .5rem; }
  h2 .icon { font-size: 1.1rem; }
  .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
  @media (max-width: 640px) { .grid-2 { grid-template-columns: 1fr; } }
  .stat-card { background: rgba(255,255,255,.03); border: 1px solid var(--border); border-radius: 10px; padding: 1rem; text-align: center; }
  .stat-card .num { font-family: 'JetBrains Mono', monospace; font-size: 1.8rem; font-weight: 700; color: var(--blue); }
  .stat-card .lbl { font-size: .8rem; color: var(--muted); margin-top: .25rem; }
  table { width: 100%; border-collapse: collapse; font-size: .9rem; }
  td { padding: .5rem .5rem; vertical-align: top; border-bottom: 1px solid rgba(255,255,255,.05); }
  td:first-child { font-weight: 600; color: var(--muted); white-space: nowrap; width: 30%; }
  ul { list-style: none; }
  li { padding: .5rem 0; border-bottom: 1px solid rgba(255,255,255,.04); font-size: .9rem; display: flex; align-items: flex-start; gap: .5rem; }
  li:last-child { border-bottom: none; }
  .good { color: var(--green); font-weight: 700; }
  .warn { color: var(--orange); font-weight: 700; }
  .bad { color: var(--red); font-weight: 700; }
  .lbl { display: inline-block; font-weight: 700; font-size: .75rem; text-transform: uppercase; letter-spacing: .5px; margin-right: .5rem; }
  .lbl-immediate { color: var(--red); }
  .lbl-week { color: var(--orange); }
  .lbl-ongoing { color: var(--blue); }
  .pitch { background: linear-gradient(135deg, rgba(59,130,246,.08), rgba(6,182,212,.08)); border: 1px solid rgba(59,130,246,.2); border-radius: 14px; padding: 2rem; text-align: center; }
  .pitch .quote { font-family: 'Playfair Display', Georgia, serif; font-size: 1.3rem; color: var(--text); font-style: italic; margin: .75rem 0; line-height: 1.5; }
  .pitch .attribution { color: var(--muted); font-size: .85rem; }
  .tier { display: inline-block; background: rgba(59,130,246,.15); color: var(--blue); padding: .25rem .75rem; border-radius: 20px; font-size: .8rem; font-weight: 600; margin-bottom: .5rem; border: 1px solid rgba(6,182,212,.2); }
  footer { text-align: center; color: var(--muted); font-size: .85rem; padding: 2rem 1.5rem; border-top: 1px solid var(--border); }
  footer a { color: var(--blue); text-decoration: none; font-weight: 600; }
  .hr { border: none; border-top: 1px solid var(--border); margin: 1rem 0; }
  .review-quote { background: rgba(255,255,255,.03); border-left: 3px solid var(--gold); padding: .75rem 1rem; margin: .5rem 0; border-radius: 0 8px 8px 0; font-size: .85rem; color: var(--muted); }

  .comp-section { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 1.75rem; margin-bottom: 1.25rem; }
  .comp-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: .75rem; margin-bottom: 1rem; }
  .comp-card { background: rgba(255,255,255,.03); border: 1px solid var(--border); border-radius: 10px; padding: 1rem; text-align: center; }
  .comp-card.highlight { border-color: var(--blue); background: rgba(55,181,255,.06); }
  .comp-name { font-weight: 700; font-size: .85rem; margin-bottom: .25rem; }
  .comp-rating { font-size: 1.2rem; font-weight: 700; }
  .comp-stat { font-size: .75rem; color: var(--muted); }
  .comp-table { width: 100%; border-collapse: collapse; font-size: .85rem; margin: 1rem 0; }
  .comp-table th { text-align: left; color: var(--muted); font-weight: 600; padding: .5rem; border-bottom: 1px solid var(--border); font-size: .8rem; }
  .comp-table td { padding: .4rem .5rem; border-bottom: 1px solid rgba(255,255,255,.05); }
  .comp-table td:first-child { font-weight: 600; color: var(--muted); white-space: nowrap; }
  .comp-verdict { background: rgba(55,181,255,.06); border-left: 3px solid var(--blue); padding: 1rem; border-radius: 0 8px 8px 0; margin-top: 1rem; }
  .comp-verdict p { font-size: .9rem; margin: 0; }
  .comp-cta { margin-top: .75rem !important; }
  .comp-card .warn { color: var(--orange); }


  /* Mobile responsive */
  @media (max-width: 768px) {
    .comp-grid { grid-template-columns: 1fr 1fr !important; }
    .hero h1 { font-size: 1.5rem !important; }
    .hero { padding: 2rem 1rem !important; }
    main { padding: 0 1rem 2rem !important; }
    section { padding: 1rem !important; }
    .grade { flex-direction: column !important; text-align: center !important; }
    .grade .letter { font-size: 3rem !important; }
    .comp-table { font-size: .75rem !important; }
    .comp-table th, .comp-table td { padding: .3rem .3rem !important; }
    .comp-table td:first-child { white-space: normal !important; }
    .grid-2 { grid-template-columns: 1fr !important; }
    .grid-3 { grid-template-columns: 1fr !important; }
    .hero h1 { font-size: 1.5rem !important; }
    .stat-card .num { font-size: 1.3rem !important; }
    .pitch .quote { font-size: 1rem !important; }
    .grade-banner { margin-top: -1.5rem !important; }
    .grade-card-inner { flex-direction: column !important; text-align: center !important; }
    .grade-card-inner .letter { font-size: 3rem !important; }
    .aln-label { min-width: 80px !important; font-size: .8rem !important; }
    .review-quote { font-size: .8rem !important; }
  }
  @media (max-width: 480px) {
    .comp-grid { grid-template-columns: 1fr 1fr !important; gap: .5rem !important; }
    .comp-name { font-size: .75rem !important; }
    .comp-rating { font-size: 1rem !important; }
    body { font-size: 14px !important; }
    .top-bar { flex-direction: column !important; text-align: center !important; font-size: .8rem !important; }
    .hero h1 { font-size: 1.3rem !important; }
    .comp-table { font-size: .7rem !important; display: block !important; overflow-x: auto !important; }
  }

</style>
